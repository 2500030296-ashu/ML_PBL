{% extends "base.html" %}

{% block title %}
Upload Dataset
{% endblock %}

{% block content %}

<h2>Upload Dataset</h2>

<form action="{{ url_for('upload') }}" method="POST" enctype="multipart/form-data">
    <input type="file" name="dataset" required>
    <button type="submit">Upload</button>
</form>


{% endblock %}
